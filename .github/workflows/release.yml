# SPDX-License-Identifier: MPL-2.0
name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version (e.g. 1.0)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: starfish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Firmware and Web Emulator
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure fm1-base and felucca-bsp are present
        run: |
          set -euo pipefail
          git submodule update --init --recursive || true
          if [ ! -f base/tools/build.py ] || [ ! -d base/bsp/chip ]; then
            rm -rf base
            git clone --recursive --depth 1 https://github.com/charlesvestal/fm1-base.git base
          fi
          chmod +x build.sh tests/run_tests.sh base/tools/get_toolchain.sh

      - name: Setup Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 xz-utils curl build-essential
          pip install --quiet pillow
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow requires libraqm/libfribidi0'"

      - name: Cache JieLi toolchain and AC79 SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/jieli
            ${{ runner.temp }}/ac79-sdk
          key: fm1-jieli-ac79-d179b448-v1

      - name: Setup JieLi toolchain and AC79 SDK
        run: |
          set -euo pipefail
          if [ ! -x "${RUNNER_TEMP}/jieli/toolchain/pi32v2/bin/clang" ]; then
            sh base/tools/get_toolchain.sh "${RUNNER_TEMP}/jieli"
          fi
          if [ ! -f "${RUNNER_TEMP}/ac79-sdk/cpu/wl82/tools/uboot.boot" ]; then
            rm -rf "${RUNNER_TEMP}/ac79-sdk"
            for attempt in 1 2 3; do
              if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "${RUNNER_TEMP}/ac79-sdk"; then
                break
              fi
              echo "AC79 SDK clone attempt ${attempt} failed, retrying..."
              rm -rf "${RUNNER_TEMP}/ac79-sdk"
              sleep 5
            done
          fi
          test "$(git -C "${RUNNER_TEMP}/ac79-sdk" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          echo "JIELI_TOOLCHAIN=${RUNNER_TEMP}/jieli/toolchain" >> "$GITHUB_ENV"
          echo "AC79_SDK=${RUNNER_TEMP}/ac79-sdk" >> "$GITHUB_ENV"

      - name: Build STARFISH hardware firmware
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          pkg=starfish
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          fi
          rm -rf dist-release dist-pages
          mkdir -p dist-release dist-pages
          if [[ -n "$version" ]]; then
            [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
            bash ./build.sh --release "$version"
            cp "app/build/${pkg}-${version}.fwsc" "dist-release/${pkg}-${version}.fwsc"
            cp "app/build/${pkg}-${version}.fwsc" "app/build/${pkg}.fwsc"
            cp "app/build/${pkg}-${version}.fwsc" "dist-pages/${pkg}.fwsc"
          else
            bash ./build.sh
            cp "app/build/${pkg}.fwsc" "dist-release/${pkg}.fwsc"
            cp "app/build/${pkg}.fwsc" "dist-pages/${pkg}.fwsc"
          fi
          ls -lh dist-release/

      # NEW: Browser emulator build
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Build STARFISH Web Emulator
        run: |
          set -euo pipefail
          bash ./build.sh --web
          test -f app/build/emu/index.html
          test -f app/build/emu/app.wasm

      - name: Run host verification suite
        run: |
          set -euo pipefail
          sh tests/run_tests.sh

      - name: Prepare GitHub Pages site
        run: |
          set -euo pipefail

          # Publish the installer and the user guide (both live at repo root)
          cp index.html guide.html dist-pages/

          if [ -d app/web/words ]; then
            cp -r app/web/words dist-pages/words
          fi

          # Publish the browser emulator
          mkdir -p dist-pages/emu
          cp -r app/build/emu/. dist-pages/emu/

          # MIDI keyboard input for the emulator (the page loads emu/app.js if it exists)
          cp emu-midi.js dist-pages/emu/app.js

          # Publish shared emulator fonts
          if [ -d app/build/fonts ]; then
            mkdir -p dist-pages/fonts
            cp -r app/build/fonts/. dist-pages/fonts/
          fi

          touch dist-pages/.nojekyll

          echo "STARFISH emulator files:"
          find dist-pages/emu -maxdepth 2 -type f

      - name: Upload single firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: starfish.fwsc
          path: dist-release/*.fwsc
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages/

  release:
    name: Publish Firmware Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: starfish.fwsc
          path: dist-release

      - name: Publish firmware to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist-release/
          fwsc_path=$(ls -1 dist-release/*.fwsc | head -n 1)
          fwsc_name=$(basename "$fwsc_path")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="STARFISH ${tag#v}"
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease --latest=false); fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" "$fwsc_path" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$tag" "$fwsc_path" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$title" \
                --generate-notes "${flags[@]}"
            fi
          else
            tag="latest"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
              gh release upload "$tag" "$fwsc_path" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --prerelease=false \
                --latest \
                --title "STARFISH Latest Build" \
                --notes "Latest STARFISH FM-1 hardware firmware (.fwsc) from commit ${GITHUB_SHA::7}."
            else
              gh release create "$tag" "$fwsc_path" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "STARFISH Latest Build" \
                --notes "Latest STARFISH FM-1 hardware firmware (.fwsc) from commit ${GITHUB_SHA::7}." \
                --latest
            fi
          fi

          {
            echo "### STARFISH Hardware Firmware"
            echo "- File: \`${fwsc_name}\`"
            echo "- Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${fwsc_name}"
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Deploy STARFISH Website and Emulator
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check or enable GitHub Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""' 2>/dev/null || echo "")

          if [ -z "$build_type" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 || true
            build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""' 2>/dev/null || echo "")
          elif [ "$build_type" != "workflow" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 || true
            build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""' 2>/dev/null || echo "")
          fi

          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Notice if Pages is not enabled
        if: steps.check.outputs.enabled != 'true'
        run: |
          echo "GitHub Pages is not enabled for ${GITHUB_REPOSITORY}."
          echo "Enable it at https://github.com/${GITHUB_REPOSITORY}/settings/pages"
