# STARFISH firmware build settings (base/tools/build.py)
name = "STARFISH"
id_prefix = "FM-1_52"
usb_manufacturer = "STARFISH"
usb_product = "STARFISH FM-1"
o2 = ["dsp.c"]
ram_layout = "packed"
words = "words.tsv"

ble = true
ble_central = true

# Browser emulator MIDI input
emu = ["midi"]

headphones = true
backup = true
usb_audio_in = true
usb_audio_out = true
usb_audio_first = true
usb_iad = true

# Website and firmware hub metadata
tagline = "8-voice VA synth, 10-kit drum machine, arp and dual LFOs for FM-1"
repo = "https://github.com/starfish-fm1/starfish"
licence = "MPL-2.0"
credits = "Includes 288 curated presets across Banks A-I plus 128 Bank X user slots."
author = "Starfish Project"
description = "STARFISH turns the M-VAVE FM-1 into an 8-voice virtual analog synthesizer with dual multimode filters, 10 synthesized drum kits, 64-step drum & 256-event synth sequencer, arpeggiator, chord memory, dual LFO modulation, stereo FX, and 288 curated presets across Banks A-I plus 128 flash user slots in Bank X."
tags = ["synth", "drum-machine", "groovebox", "sequencer"]
install = "https://starfish-fm1.github.io/starfish/install/"
site = "https://starfish-fm1.github.io/starfish/"
screenshot = "docs/img/screen.png"
